<!DOCTYPE html>
<html lang="en">
  {% include head.html %}
  <body>

    {% include nav.html %}

    <div class="docs">
      {% include sidebar.html %}

      <main class="docs__main" id="content">

        <header class="article__header">
          <p class="vp-eyebrow vp-eyebrow--teal">Changelog</p>
          <h1 class="article__title">{{ page.title }}</h1>
        </header>

        <form class="compare__form select_to_change" onsubmit="dodiff(); return false;">
          <div class="compare__field compare__field--platform">
            <label class="vp-eyebrow" for="compare_platform">Platform</label>
            <div class="vp-select">
              <select id="compare_platform" onchange="changeType(this.value)">
                <option value="ios_one">iOS</option>
                <option value="android_one">Android</option>
              </select>
            </div>
          </div>

          <div class="compare__field">
            <span class="vp-eyebrow">From version</span>
            <div class="vp-select">
              <select id="diff_ios_1" class="select_version ios_one" aria-label="From version (iOS)">
                <option value="">Please choose...</option>
                {% for p in site.categories.ios %}
                <option value="ios_{{ p.version }}">{{ p.version }}</option>
                {% endfor %}
              </select>
              <select id="diff_android_1" class="select_version android_one" aria-label="From version (Android)">
                <option value="">Please choose...</option>
                {% for p in site.categories.android %}
                <option value="android_{{ p.version }}">{{ p.version }}</option>
                {% endfor %}
              </select>
            </div>
          </div>

          <div class="compare__field">
            <span class="vp-eyebrow">To version</span>
            <div class="vp-select">
              <select id="diff_ios_2" class="select_version ios_one" aria-label="To version (iOS)">
                <option value="">Please choose...</option>
                {% for p in site.categories.ios %}
                <option value="ios_{{ p.version }}">{{ p.version }}</option>
                {% endfor %}
              </select>
              <select id="diff_android_2" class="select_version android_one" aria-label="To version (Android)">
                <option value="">Please choose...</option>
                {% for p in site.categories.android %}
                <option value="android_{{ p.version }}">{{ p.version }}</option>
                {% endfor %}
              </select>
            </div>
          </div>

          <div class="compare__actions">
            <button type="submit" class="vp-btn vp-btn--primary">See Differences</button>
          </div>
        </form>

        {{ content }}

      </main>
    </div>

    {% include footer.html %}

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.2.3/jquery.js"></script>
    <script src="{{ "/assets/2diff.js" | prepend: site.baseurl }}"></script>
    <script>
      loadPlatform("ios", false);

      var from_version;
      var to_version;
      var selected_type;
      var a, b;

      function changeType(clazz){
        if(clazz == "ios_one"){
          $(".ios_one").show();
          $(".android_one").hide();
          selected_type = "ios";
        } else {
          $(".ios_one").hide();
          $(".android_one").show();
          selected_type = "android";
        }
      }
      changeType("ios_one");

      function dodiff(){
        var ios = (selected_type == "ios");
        var fromSel = document.getElementById(ios ? "diff_ios_1" : "diff_android_1");
        var toSel = document.getElementById(ios ? "diff_ios_2" : "diff_android_2");
        var from = fromSel.options[fromSel.selectedIndex].value;
        var to = toSel.options[toSel.selectedIndex].value;
        if (!from || !to) { return; }
        from_version = from.replace("_", " ");
        to_version = to.replace("_", " ");
        a = document.getElementById(from).textContent;
        b = document.getElementById(to).textContent;
        diffUsingJS(0);
      }

      function diffUsingJS(viewType) {
        "use strict";
        var byId = function (id) { return document.getElementById(id); },
          base = difflib.stringAsLines(a),
          newtxt = difflib.stringAsLines(b),
          sm = new difflib.SequenceMatcher(base, newtxt),
          opcodes = sm.get_opcodes(),
          diffoutputdiv = byId("diffoutput");

        diffoutputdiv.innerHTML = "";

        diffoutputdiv.appendChild(diffview.buildView({
          baseTextLines: base,
          newTextLines: newtxt,
          opcodes: opcodes,
          baseTextName: from_version,
          newTextName: to_version,
          contextSize: 0,
          viewType: viewType
        }));
      }
    </script>

    {% include analytics.html %}
  </body>
</html>
