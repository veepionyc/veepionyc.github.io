<head>
  <meta charset="utf-8">
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060d0a">

  <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">

  <link rel="icon" type="image/png" sizes="32x32" href="{{ "/assets/favicon-32.png" | prepend: site.baseurl }}">
  <link rel="apple-touch-icon" href="{{ "/assets/apple-touch-icon.png" | prepend: site.baseurl }}">

  <link rel="preload" href="{{ "/assets/fonts/oswald-latin-var.woff2" | prepend: site.baseurl }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ "/assets/fonts/figtree-latin-var.woff2" | prepend: site.baseurl }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ "/css/main.css" | prepend: site.baseurl }}">

  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ "/feed.xml" | prepend: site.baseurl | prepend: site.url }}">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/anchor-js/3.2.0/anchor.min.js"></script>
</head>
